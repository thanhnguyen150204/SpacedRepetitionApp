services:
  postgres:
    image: postgres:16-alpine
    container_name: spaced_repetition_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: spaced_user
      POSTGRES_PASSWORD: spaced_pass
      POSTGRES_DB: spaced_repetition
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U spaced_user -d spaced_repetition']
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: spaced_repetition_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      - postgres

volumes:
  postgres_data:
